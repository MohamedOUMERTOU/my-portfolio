<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1120" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="720" cy="60" r="140" fill="#fff" opacity="0.08"/>
  <circle cx="60" cy="420" r="120" fill="#fff" opacity="0.08"/>

  <!-- window -->
  <g filter="url(#sh)">
    <rect x="90" y="55" width="620" height="350" rx="16" fill="#0f172a"/>
  </g>
  <rect x="90" y="55" width="620" height="36" rx="16" fill="#1e293b"/>
  <rect x="90" y="75" width="620" height="16" fill="#1e293b"/>
  <circle cx="114" cy="73" r="6" fill="#f87171"/>
  <circle cx="134" cy="73" r="6" fill="#fbbf24"/>
  <circle cx="154" cy="73" r="6" fill="#34d399"/>
  <text x="400" y="78" fill="#94a3b8" font-size="13" text-anchor="middle">Insurance ERP — Dashboard</text>

  <!-- sidebar -->
  <rect x="90" y="91" width="120" height="314" fill="#111c33"/>
  <rect x="108" y="112" width="84" height="12" rx="6" fill="url(#bar)"/>
  <rect x="108" y="142" width="70" height="8" rx="4" fill="#334155"/>
  <rect x="108" y="164" width="78" height="8" rx="4" fill="#334155"/>
  <rect x="108" y="186" width="62" height="8" rx="4" fill="#334155"/>
  <rect x="108" y="208" width="74" height="8" rx="4" fill="#334155"/>
  <rect x="108" y="230" width="58" height="8" rx="4" fill="#334155"/>

  <!-- KPI cards -->
  <g font-size="11" fill="#94a3b8">
    <rect x="228" y="108" width="148" height="64" rx="10" fill="#1e293b"/>
    <text x="242" y="130">Policies</text>
    <text x="242" y="158" fill="#f8fafc" font-size="20" font-weight="700">12,480</text>
    <rect x="390" y="108" width="148" height="64" rx="10" fill="#1e293b"/>
    <text x="404" y="130">Claims</text>
    <text x="404" y="158" fill="#f8fafc" font-size="20" font-weight="700">1,326</text>
    <rect x="552" y="108" width="140" height="64" rx="10" fill="#1e293b"/>
    <text x="566" y="130">Premiums</text>
    <text x="566" y="158" fill="#f8fafc" font-size="20" font-weight="700">4.2M</text>
  </g>

  <!-- bar chart -->
  <rect x="228" y="186" width="270" height="202" rx="10" fill="#1e293b"/>
  <text x="242" y="208" fill="#94a3b8" font-size="11">Monthly subscriptions</text>
  <g fill="url(#bar)">
    <rect x="246" y="300" width="22" height="70" rx="4"/>
    <rect x="280" y="270" width="22" height="100" rx="4"/>
    <rect x="314" y="285" width="22" height="85" rx="4"/>
    <rect x="348" y="240" width="22" height="130" rx="4"/>
    <rect x="382" y="255" width="22" height="115" rx="4"/>
    <rect x="416" y="226" width="22" height="144" rx="4"/>
    <rect x="450" y="244" width="22" height="126" rx="4"/>
  </g>

  <!-- table -->
  <rect x="512" y="186" width="180" height="202" rx="10" fill="#1e293b"/>
  <text x="526" y="208" fill="#94a3b8" font-size="11">Recent contracts</text>
  <g>
    <rect x="526" y="224" width="80" height="8" rx="4" fill="#475569"/>
    <rect x="638" y="222" width="40" height="12" rx="6" fill="#34d399" opacity="0.8"/>
    <rect x="526" y="256" width="64" height="8" rx="4" fill="#475569"/>
    <rect x="638" y="254" width="40" height="12" rx="6" fill="#fbbf24" opacity="0.8"/>
    <rect x="526" y="288" width="88" height="8" rx="4" fill="#475569"/>
    <rect x="638" y="286" width="40" height="12" rx="6" fill="#34d399" opacity="0.8"/>
    <rect x="526" y="320" width="70" height="8" rx="4" fill="#475569"/>
    <rect x="638" y="318" width="40" height="12" rx="6" fill="#f87171" opacity="0.8"/>
    <rect x="526" y="352" width="76" height="8" rx="4" fill="#475569"/>
    <rect x="638" y="350" width="40" height="12" rx="6" fill="#34d399" opacity="0.8"/>
  </g>
</svg>
