<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1120" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="700" cy="380" r="160" fill="#fff" opacity="0.08"/>
  <circle cx="80" cy="60" r="120" fill="#fff" opacity="0.08"/>

  <!-- app window -->
  <g filter="url(#sh)">
    <rect x="60" y="50" width="520" height="350" rx="16" fill="#0f172a"/>
  </g>
  <rect x="60" y="50" width="520" height="36" rx="16" fill="#1e293b"/>
  <rect x="60" y="70" width="520" height="16" fill="#1e293b"/>
  <circle cx="84" cy="68" r="6" fill="#f87171"/>
  <circle cx="104" cy="68" r="6" fill="#fbbf24"/>
  <circle cx="124" cy="68" r="6" fill="#34d399"/>
  <text x="320" y="73" fill="#94a3b8" font-size="13" text-anchor="middle">GED — Documents</text>

  <!-- search -->
  <rect x="80" y="102" width="480" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
  <circle cx="102" cy="120" r="7" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="107" y1="125" x2="112" y2="130" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text x="122" y="125" fill="#64748b" font-size="13">Search: contract 2025…</text>
  <rect x="478" y="108" width="74" height="24" rx="12" fill="url(#g)"/>
  <text x="515" y="124" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Full-text</text>

  <!-- folders -->
  <g font-size="12" fill="#e2e8f0">
    <g transform="translate(80 154)">
      <path d="M0 8 a6 6 0 0 1 6 -6 h34 l10 10 h56 a6 6 0 0 1 6 6 v52 a6 6 0 0 1 -6 6 h-100 a6 6 0 0 1 -6 -6z" fill="#38bdf8"/>
      <text x="56" y="92" text-anchor="middle">Contracts</text>
    </g>
    <g transform="translate(206 154)">
      <path d="M0 8 a6 6 0 0 1 6 -6 h34 l10 10 h56 a6 6 0 0 1 6 6 v52 a6 6 0 0 1 -6 6 h-100 a6 6 0 0 1 -6 -6z" fill="#a855f7"/>
      <text x="56" y="92" text-anchor="middle">Invoices</text>
    </g>
    <g transform="translate(332 154)">
      <path d="M0 8 a6 6 0 0 1 6 -6 h34 l10 10 h56 a6 6 0 0 1 6 6 v52 a6 6 0 0 1 -6 6 h-100 a6 6 0 0 1 -6 -6z" fill="#f472b6"/>
      <text x="56" y="92" text-anchor="middle">HR</text>
    </g>
    <g transform="translate(458 154)">
      <path d="M0 8 a6 6 0 0 1 6 -6 h34 l10 10 h56 a6 6 0 0 1 6 6 v52 a6 6 0 0 1 -6 6 h-100 a6 6 0 0 1 -6 -6z" fill="#34d399"/>
      <text x="51" y="92" text-anchor="middle">Archives</text>
    </g>
  </g>

  <!-- file list -->
  <g font-size="12">
    <rect x="80" y="266" width="480" height="38" rx="8" fill="#1e293b"/>
    <rect x="94" y="276" width="16" height="20" rx="3" fill="#f87171"/>
    <text x="122" y="290" fill="#e2e8f0">contract_client_A.pdf</text>
    <text x="360" y="290" fill="#64748b">v3</text>
    <rect x="470" y="276" width="74" height="18" rx="9" fill="#34d399" opacity="0.85"/>
    <text x="507" y="289" fill="#064e3b" font-size="10" font-weight="700" text-anchor="middle">APPROVED</text>

    <rect x="80" y="312" width="480" height="38" rx="8" fill="#1e293b"/>
    <rect x="94" y="322" width="16" height="20" rx="3" fill="#38bdf8"/>
    <text x="122" y="336" fill="#e2e8f0">invoice_0425.docx</text>
    <text x="360" y="336" fill="#64748b">v1</text>
    <rect x="470" y="322" width="74" height="18" rx="9" fill="#fbbf24" opacity="0.85"/>
    <text x="507" y="335" fill="#78350f" font-size="10" font-weight="700" text-anchor="middle">PENDING</text>

    <rect x="80" y="358" width="480" height="30" rx="8" fill="#1e293b" opacity="0.6"/>
    <rect x="94" y="366" width="140" height="8" rx="4" fill="#334155"/>
  </g>

  <!-- storage + security -->
  <g transform="translate(620 90)">
    <rect width="140" height="120" rx="16" fill="#0f172a" opacity="0.9"/>
    <g fill="none" stroke="url(#g)" stroke-width="4">
      <ellipse cx="70" cy="34" rx="34" ry="10"/>
      <path d="M36 34 v40 a34 10 0 0 0 68 0 v-40"/>
      <path d="M36 54 a34 10 0 0 0 68 0"/>
    </g>
    <text x="70" y="106" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Object storage</text>
  </g>
  <g transform="translate(620 230)">
    <rect width="140" height="120" rx="16" fill="#0f172a" opacity="0.9"/>
    <path d="M70 18 l30 12 v22 c0 20 -14 34 -30 40 c-16 -6 -30 -20 -30 -40 v-22z" fill="url(#g)"/>
    <path d="M57 55 l9 9 l17 -18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="108" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Access rights</text>
  </g>
</svg>
