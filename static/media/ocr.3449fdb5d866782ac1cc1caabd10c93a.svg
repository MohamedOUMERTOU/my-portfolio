<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a855f7"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="215" r="110" fill="url(#g)" opacity="0.35" filter="url(#glow)"/>

  <!-- document -->
  <g transform="translate(70 100)">
    <path d="M0 0 H130 L170 40 V240 H0 Z" fill="#f8fafc"/>
    <path d="M130 0 V40 H170" fill="#cbd5e1"/>
    <rect x="18" y="26" width="80" height="10" rx="5" fill="#0ea5e9"/>
    <rect x="18" y="60" width="130" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="18" y="78" width="112" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="18" y="96" width="124" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="18" y="128" width="60" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="96" y="128" width="52" height="7" rx="3.5" fill="#a855f7"/>
    <rect x="18" y="146" width="70" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="96" y="146" width="44" height="7" rx="3.5" fill="#a855f7"/>
    <rect x="18" y="164" width="54" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="96" y="164" width="56" height="7" rx="3.5" fill="#a855f7"/>
    <rect x="18" y="200" width="72" height="18" rx="4" fill="none" stroke="#db2777" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- scan line -->
    <rect x="-8" y="112" width="186" height="3" fill="#0ea5e9" opacity="0.9"/>
    <rect x="-8" y="100" width="186" height="26" fill="#0ea5e9" opacity="0.12"/>
  </g>
  <text x="155" y="372" fill="#94a3b8" font-size="13" text-anchor="middle">invoice.pdf</text>

  <!-- arrows -->
  <line x1="258" y1="220" x2="318" y2="220" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="482" y1="220" x2="542" y2="220" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="288" y="206" fill="#64748b" font-size="11" text-anchor="middle">base64</text>
  <text x="512" y="206" fill="#64748b" font-size="11" text-anchor="middle">API</text>

  <!-- AI model -->
  <circle cx="400" cy="220" r="72" fill="#0f172a" stroke="url(#g)" stroke-width="4"/>
  <g stroke="#a855f7" stroke-width="2" opacity="0.8">
    <line x1="370" y1="195" x2="400" y2="210"/><line x1="370" y1="195" x2="400" y2="235"/>
    <line x1="370" y1="245" x2="400" y2="210"/><line x1="370" y1="245" x2="400" y2="235"/>
    <line x1="400" y1="210" x2="430" y2="220"/><line x1="400" y1="235" x2="430" y2="220"/>
  </g>
  <g fill="#f8fafc">
    <circle cx="370" cy="195" r="7"/><circle cx="370" cy="245" r="7"/>
    <circle cx="400" cy="210" r="7"/><circle cx="400" cy="235" r="7"/>
  </g>
  <circle cx="430" cy="220" r="9" fill="url(#g)"/>
  <text x="400" y="318" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Vision LLM</text>
  <text x="400" y="338" fill="#94a3b8" font-size="12" text-anchor="middle">Ollama · Qwen2.5-VL</text>

  <!-- JSON -->
  <g transform="translate(556 118)">
    <rect width="186" height="204" rx="14" fill="#0f172a" stroke="#334155"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="13">
      <text x="16" y="32" fill="#f8fafc">{</text>
      <text x="30" y="58"><tspan fill="#38bdf8">"vendor"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#f0abfc">"ACME"</tspan></text>
      <text x="30" y="84"><tspan fill="#38bdf8">"date"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#f0abfc">"2025-03"</tspan></text>
      <text x="30" y="110"><tspan fill="#38bdf8">"total"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#fbbf24">1250.0</tspan></text>
      <text x="30" y="136"><tspan fill="#38bdf8">"items"</tspan><tspan fill="#f8fafc">: [ … ]</tspan></text>
      <text x="16" y="162" fill="#f8fafc">}</text>
    </g>
    <rect x="16" y="178" width="70" height="14" rx="7" fill="#34d399" opacity="0.85"/>
  </g>
  <text x="649" y="350" fill="#94a3b8" font-size="13" text-anchor="middle">structured JSON</text>
</svg>
